<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaserLink | Alterar senha</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f7f4fa;color:#281d2e}.app{max-width:560px;margin:40px auto;padding:16px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 18px #0000000d}.brand{font-size:26px;font-weight:900;color:#6f2dbd;margin-bottom:20px}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#efe5f7;color:#6f2dbd;font-size:12px;font-weight:800}label{display:block;font-size:13px;font-weight:700;margin-top:14px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:11px;margin-top:6px;font-size:15px}button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer;margin-top:12px}.primary{background:#6f2dbd;color:#fff}.secondary{background:#eee4f7;color:#612496}.muted{color:#766d7b;font-size:13px}.ok{color:#18794e}.err{color:#b42318}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="app"><div class="brand">⚡ LaserLink</div><div class="card"><span class="pill">SEGURANÇA DA CONTA</span><h2>Alterar senha</h2><p class="muted" id="status">Verificando sua sessão...</p><div id="form" style="display:none"><label>Nova senha</label><input id="newPass" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"><label>Confirmar nova senha</label><input id="confirmPass" type="password" minlength="8" autocomplete="new-password" placeholder="Digite novamente"><button class="primary" onclick="changePassword()">Salvar nova senha</button><button class="secondary" onclick="location.href='./'">Voltar ao LaserLink</button><p id="msg" class="muted"></p></div></div></main>
<script>const SUPABASE_URL='https://urarxsgdngliqphcnyyl.supabase.co';const SUPABASE_KEY='sb_publishable_w3hmXEb-vBBdwVnoAKcy-A_iwbuF1FT';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function init(){const {data:{session}}=await sb.auth.getSession();const s=document.getElementById('status');if(!session){s.className='err';s.textContent='Você precisa entrar na sua conta LaserLink antes de alterar a senha.';setTimeout(()=>location.href='./',1800);return}s.textContent='Conta autenticada. Defina sua nova senha.';document.getElementById('form').style.display='block'}async function changePassword(){const p=document.getElementById('newPass').value,c=document.getElementById('confirmPass').value,m=document.getElementById('msg');if(p.length<8){m.className='err';m.textContent='Use pelo menos 8 caracteres.';return}if(p!==c){m.className='err';m.textContent='As senhas não coincidem.';return}m.className='muted';m.textContent='Alterando senha...';const {error}=await sb.auth.updateUser({password:p});if(error){m.className='err';m.textContent='Não foi possível alterar a senha: '+error.message;return}document.getElementById('newPass').value='';document.getElementById('confirmPass').value='';m.className='ok';m.textContent='Senha alterada com sucesso.'}init();</script></body></html>
